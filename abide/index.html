<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abide</title>
<meta name="description" content="A cottage-style Bible companion: Proverbs 31 progress sheet, fasting with prayer, a 6-week Bible study, scripture to memorise and lessons on walking with God.">
<meta name="theme-color" content="#f5efe3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abide">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Nunito:wght@400;600;700&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: an iPad-style home screen in a cottage kitchen. A moss-green side panel (like a lock-screen widget column)
   holds the sections; on phones it slides out as a drawer and a rounded dock sits at the bottom.
   Pages are linen with pinned paper cards, washi-tape labels and sticky notes. */
:root {
  --linen: #f5efe3;
  --paper: #fffaf2;
  --paper-2: #f9f1e3;
  --ink: #4f3a2c;
  --ink-soft: #85705d;
  --line: #e6d8c3;
  --moss: #5a6a42;
  --moss-deep: #4a5836;
  --moss-ink: #f5efdc;
  --moss-soft: rgba(245,239,220,.16);
  --sage: #8c9d6f;
  --sage-soft: #e1e7d0;
  --rose: #c97d74;
  --rose-ink: #a85c53;
  --blush: #f6dcd5;
  --butter: #edd27e;
  --butter-soft: #f8ecc6;
  --peach: #f6dcc4;
  --lavender: #e4daf0;
  --sky: #d7e3ea;
  --gold: #b88a35;
  --on-accent: #fffaf2;
  --shadow: 0 1px 0 rgba(79,58,44,.05), 0 10px 26px -16px rgba(79,58,44,.4);
  --shadow-lift: 0 18px 36px -18px rgba(79,58,44,.5);
  --display: "Fraunces", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --linen: #1e1b15; --paper: #29251d; --paper-2: #312b22; --ink: #f1e7d5; --ink-soft: #bfac94; --line: #463c30;
    --moss: #39462a; --moss-deep: #2e3922; --moss-ink: #eee6d0; --moss-soft: rgba(238,230,208,.12);
    --sage: #a7b88a; --sage-soft: #36402b; --rose: #e0a097; --rose-ink: #eab1a8; --blush: #4a322e;
    --butter: #d8bd66; --butter-soft: #463c24; --peach: #4b3828; --lavender: #3d3550; --sky: #2f3c45; --gold: #ddb565;
    --on-accent: #1e1b15;
    --shadow: 0 10px 26px -16px rgba(0,0,0,.75); --shadow-lift: 0 18px 36px -16px rgba(0,0,0,.85);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --linen: #1e1b15; --paper: #29251d; --paper-2: #312b22; --ink: #f1e7d5; --ink-soft: #bfac94; --line: #463c30;
  --moss: #39462a; --moss-deep: #2e3922; --moss-ink: #eee6d0; --moss-soft: rgba(238,230,208,.12);
  --sage: #a7b88a; --sage-soft: #36402b; --rose: #e0a097; --rose-ink: #eab1a8; --blush: #4a322e;
  --butter: #d8bd66; --butter-soft: #463c24; --peach: #4b3828; --lavender: #3d3550; --sky: #2f3c45; --gold: #ddb565;
  --on-accent: #1e1b15;
  --shadow: 0 10px 26px -16px rgba(0,0,0,.75); --shadow-lift: 0 18px 36px -16px rgba(0,0,0,.85);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--linen); color: var(--ink);
  font: 16px/1.55 var(--body);
  background-image:
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--ink) 6%, transparent) 1px, transparent 0);
  background-size: 22px 22px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--linen); }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--rose-ink); }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- frame ---------- */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--moss); color: var(--moss-ink);
  padding: calc(22px + env(safe-area-inset-top, 0px)) 18px 22px max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 40px; height: 40px; flex: none; }
.brand h1 { font-size: 1.7rem; font-style: italic; font-weight: 400; letter-spacing: .01em; }
.brand small { display: block; font: 600 .72rem/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
.mini { background: var(--moss-soft); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; font-size: .85rem; }
.mini-date { font-family: var(--display); font-size: 1.05rem; }
.mini-dots { display: flex; gap: 6px; align-items: center; }
.mini-dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--moss-ink); opacity: .9; }
.mini-dots i.on { background: var(--moss-ink); }
.mini-fast { font-variant-numeric: tabular-nums; }
.nav { display: grid; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: none; border: 0; border-radius: 12px; padding: 9px 12px; cursor: pointer; color: var(--moss-ink);
  font-weight: 600; font-size: .96rem;
}
.nav button svg { width: 22px; height: 22px; flex: none; }
.nav button:hover { background: var(--moss-soft); }
.nav button[aria-current="page"] { background: var(--moss-ink); color: var(--moss-deep); }
.side-foot { margin-top: auto; font-family: var(--hand); font-size: 1.2rem; line-height: 1.2; opacity: .85; }

.main { min-width: 0; padding-block: 28px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; }
.page { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px; position: relative; z-index: 1; }

.topbar { display: none; }
.dock { display: none; }
.scrim { display: none; }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; z-index: 60; left: 0; top: 0; bottom: 0; width: min(300px, 84vw); height: auto;
    transform: translateX(-104%); transition: transform .28s ease; box-shadow: var(--shadow-lift);
  }
  .app.drawer .side { transform: none; }
  .app.drawer .scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(30,24,18,.35); }
  .topbar {
    display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
    background: color-mix(in srgb, var(--linen) 92%, transparent); backdrop-filter: blur(8px);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line);
  }
  .topbar h2 { font-size: 1.25rem; font-style: italic; font-weight: 400; }
  .main { padding-top: 18px; }
  .dock {
    display: flex; position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
    bottom: calc(12px + env(safe-area-inset-bottom, 0px)); gap: 6px; padding: 8px;
    background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow-lift);
  }
  .dock button { width: 52px; height: 52px; border-radius: 15px; border: 0; display: grid; place-items: center; cursor: pointer; }
  .dock button svg { width: 24px; height: 24px; }
  .dock button[aria-current="page"] { outline: 2px solid var(--ink); outline-offset: 1px; }
}
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 22px; height: 22px; }

/* decorative corner flowers */
.deco { position: fixed; pointer-events: none; z-index: 0; opacity: .55; }
.deco.tr { top: calc(-20px + env(safe-area-inset-top, 0px)); right: -30px; width: 230px; }
.deco.bl { bottom: -26px; left: 250px; width: 200px; }
@media (max-width: 900px) { .deco.bl { left: -40px; } .deco { opacity: .3; } .deco.tr { width: 140px; right: -40px; } }
@media (max-width: 640px) { .banner svg.sprig { width: 80px; opacity: .2; } }

/* ---------- shared pieces ---------- */
.head { display: grid; gap: 6px; }
.eyebrow { font-weight: 700; font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.head h2 { font-size: clamp(1.9rem, 4.4vw, 2.7rem); }
.head h2 em { font-weight: 400; color: var(--rose-ink); }
.lede { color: var(--ink-soft); max-width: 62ch; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 1.3rem; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 980px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--ink-soft); }
.small { font-size: .88rem; }

.tape {
  display: inline-block; padding: 4px 14px; font: 700 .76rem/1.3 var(--body); letter-spacing: .12em; text-transform: uppercase;
  background: var(--sage-soft); color: var(--ink); transform: rotate(-1.5deg);
  clip-path: polygon(2% 0, 98% 4%, 100% 50%, 97% 100%, 3% 96%, 0 50%);
}
.tape.rose { background: var(--blush); } .tape.butter { background: var(--butter-soft); } .tape.lav { background: var(--lavender); } .tape.sky { background: var(--sky); } .tape.peach { background: var(--peach); }

.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 18px; cursor: pointer;
  border: 1.5px solid var(--ink); background: var(--paper); font-weight: 700; font-size: .92rem;
}
.btn svg { width: 18px; height: 18px; }
.btn:hover { background: var(--paper-2); }
.btn.primary { background: var(--moss); border-color: var(--moss); color: var(--moss-ink); }
.btn.primary:hover { background: var(--moss-deep); }
.btn.rose { background: var(--rose); border-color: var(--rose); color: var(--on-accent); }
.btn.ghost { border-color: var(--line); }
.btn.small { padding: 5px 12px; font-size: .82rem; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .88rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

label.field { display: grid; gap: 5px; font-weight: 700; font-size: .86rem; }
.field input, .field select, .field textarea, textarea.note, input.text {
  width: 100%; border: 1px solid var(--line); background: var(--paper-2); border-radius: 12px; padding: 10px 12px; font-weight: 400; font-size: 1rem;
}
textarea { resize: vertical; min-height: 84px; }
textarea.lined {
  font-family: var(--hand); font-size: 1.35rem; line-height: 32px; padding: 4px 12px; min-height: 100px;
  background: repeating-linear-gradient(var(--paper-2), var(--paper-2) 31px, var(--line) 31px, var(--line) 32px);
  border: 1px solid var(--line); border-radius: 12px; width: 100%;
}

.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 6px 0; }
.check input { appearance: none; flex: none; width: 22px; height: 22px; margin: 1px 0 0; border: 1.5px solid var(--ink-soft); border-radius: 7px; background: var(--paper); cursor: pointer; display: grid; place-items: center; }
.check input:checked { background: var(--sage); border-color: var(--sage); }
.check input:checked::after { content: ""; width: 10px; height: 6px; border: 2.5px solid var(--on-accent); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.check input:checked + span { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-soft) 50%, transparent); }

.sticky {
  font-family: var(--hand); font-size: 1.4rem; line-height: 1.2; padding: 18px 18px 20px; border-radius: 3px;
  background: var(--blush); box-shadow: var(--shadow); transform: rotate(-1deg); position: relative;
}
.sticky::before { content: ""; position: absolute; top: -9px; left: 50%; width: 70px; height: 20px; transform: translateX(-50%) rotate(2deg); background: color-mix(in srgb, var(--butter) 60%, transparent); }
.sticky.butter { background: var(--butter-soft); transform: rotate(1deg); }
.sticky.sage { background: var(--sage-soft); }
.sticky.lav { background: var(--lavender); transform: rotate(.6deg); }
.sticky.sky { background: var(--sky); }
.sticky.peach { background: var(--peach); transform: rotate(-.4deg); }
.sticky small { display: block; font-family: var(--body); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; margin-top: 8px; color: var(--ink-soft); }

.verse { font-family: var(--display); font-style: italic; font-size: 1.12rem; line-height: 1.55; }
.ref { font-weight: 700; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--rose-ink); }
.bar { height: 10px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--sage); border-radius: 99px; }
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px dashed var(--line); padding-bottom: 12px; }
.subtabs button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--ink-soft); }
.subtabs button[aria-pressed="true"] { background: var(--blush); color: var(--ink); }
.datenav { display: flex; align-items: center; gap: 8px; }
.datenav button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer; display: grid; place-items: center; }
.datenav button svg { width: 18px; height: 18px; }
.datenav span { font-family: var(--display); font-size: 1.1rem; min-width: 0; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 18px; color: var(--ink-soft); text-align: center; }
.ring { width: 92px; height: 92px; flex: none; }
.ring text { font-family: var(--display); fill: var(--ink); }

/* ---------- home ---------- */
.hello { display: flex; justify-content: space-between; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.hello h2 { font-size: clamp(2rem, 5vw, 3rem); }
.hello h2 em { font-weight: 400; color: var(--rose-ink); }
.votd { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 22px; align-items: center; padding: 24px; background: var(--paper); }
.votd .art { background: var(--sage-soft); border-radius: 14px; aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; transform: rotate(-2deg); box-shadow: var(--shadow); border: 6px solid var(--paper); outline: 1px solid var(--line); }
.votd .art svg { width: 82%; }
.votd .verse { font-size: clamp(1.2rem, 2.4vw, 1.5rem); }
@media (max-width: 560px) { .votd { grid-template-columns: minmax(0, 1fr); } .votd .art { width: 120px; } }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 18px 12px; }
.tile { display: grid; justify-items: center; gap: 7px; background: none; border: 0; cursor: pointer; font-weight: 600; font-size: .86rem; text-align: center; }
.tile i { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; box-shadow: var(--shadow); border: 1px solid color-mix(in srgb, var(--ink) 8%, transparent); transition: transform .15s; }
.tile i svg { width: 30px; height: 30px; }
.tile:hover i { transform: translateY(-2px) rotate(-2deg); }
.bg-rose { background: var(--blush); } .bg-sage { background: var(--sage-soft); } .bg-butter { background: var(--butter-soft); }
.bg-lav { background: var(--lavender); } .bg-sky { background: var(--sky); } .bg-peach { background: var(--peach); } .bg-paper { background: var(--paper-2); }
.rhythm { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .rhythm { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.step { border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; background: var(--paper-2); text-align: left; cursor: pointer; display: grid; gap: 4px; align-content: start; }
.step b { font-family: var(--display); font-size: 1.15rem; display: flex; justify-content: space-between; align-items: center; }
.step span { font-size: .84rem; color: var(--ink-soft); }
.step.on { background: var(--sage-soft); border-color: var(--sage); }
.step .dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--ink-soft); display: grid; place-items: center; }
.step.on .dot { background: var(--sage); border-color: var(--sage); color: var(--on-accent); }
.step .dot svg { width: 13px; height: 13px; }
.widget h4 { font-size: 1.05rem; margin-bottom: 6px; }
.big-num { font-family: var(--display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* ---------- proverbs 31 ---------- */
.banner { background: var(--moss); color: var(--moss-ink); border-radius: var(--r); padding: 22px 24px; display: grid; gap: 6px; position: relative; overflow: hidden; }
.banner .verse { font-size: clamp(1.15rem, 2.4vw, 1.45rem); }
.banner .ref { color: var(--butter); }
.banner svg.sprig { position: absolute; right: 10px; bottom: -8px; width: 120px; opacity: .35; }
.traits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 700px) { .traits { grid-template-columns: minmax(0, 1fr); } }
.trait { padding: 16px 18px; display: grid; gap: 6px; }
.trait-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.trait h3 { font-size: 1.12rem; }
.num { font-family: var(--hand); font-size: 1.6rem; line-height: 1; color: var(--rose-ink); margin-right: 4px; }
.count { font-weight: 700; font-size: .8rem; padding: 3px 10px; border-radius: 99px; background: var(--paper-2); border: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.count.full { background: var(--sage); color: var(--on-accent); border-color: var(--sage); }
.sheet-wrap { overflow-x: auto; }
table.sheet { border-collapse: separate; border-spacing: 4px; width: 100%; min-width: 560px; font-variant-numeric: tabular-nums; }
.sheet th { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; padding: 4px; }
.sheet th.t { text-align: left; text-transform: none; letter-spacing: 0; font-size: .92rem; color: var(--ink); font-weight: 600; }
.sheet td { text-align: center; }
.cell { width: 30px; height: 30px; border-radius: 50%; margin: 0 auto; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .75rem; font-weight: 700; }
.lv1 { background: color-mix(in srgb, var(--sage) 25%, var(--paper)); }
.lv2 { background: color-mix(in srgb, var(--sage) 50%, var(--paper)); }
.lv3 { background: color-mix(in srgb, var(--sage) 75%, var(--paper)); }
.lv4 { background: var(--sage); color: var(--on-accent); border-color: var(--sage); }
.today-col .cell { outline: 2px solid var(--rose); outline-offset: 1px; }
.legend { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .82rem; color: var(--ink-soft); }
.legend .cell { width: 18px; height: 18px; margin: 0; }
.trend { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; align-items: end; height: 150px; padding-top: 18px; }
.trend div { display: grid; gap: 4px; justify-items: center; height: 100%; align-content: end; font-size: .74rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.trend b { width: 100%; max-width: 36px; background: var(--rose); border-radius: 8px 8px 3px 3px; min-height: 3px; }
.trend .cur b { background: var(--moss); }
.rate { display: flex; gap: 4px; }

const KEY = 'abide.v1';
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const mondayOf = k => { const d = parseKey(k); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return keyOf(d); };
const monthOf = k => k.slice(0, 7);

function ring(frac, label, sub) {
  const r = 38, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg class="ring" viewBox="0 0 92 92" role="img" aria-label="${esc(label)} ${esc(sub || '')}">
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--sage)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - f)}" transform="rotate(-90 46 46)"/>
    <text x="46" y="${sub ? 46 : 52}" text-anchor="middle" font-size="20">${esc(label)}</text>
    ${sub ? `<text x="46" y="62" text-anchor="middle" font-size="10" style="font-family:var(--body);fill:var(--ink-soft)">${esc(sub)}</text>` : ''}</svg>`;
}
const p31Count = (date, tid) => Object.values(((S.p31[date] || {})[tid]) || {}).filter(Boolean).length;
const p31DayTotal = date => TRAITS.reduce((n, t) => n + p31Count(date, t.id), 0);

function rhythmStreak() {
  let k = todayKey(), n = 0;
  const any = d => Object.values(S.rhythm[d] || {}).some(Boolean);
  if (!any(k)) k = addDays(k, -1);
  while (any(k)) { n++; k = addDays(k, -1); }
  return n;
}

function nextReading() { return studyFlat().find(x => !S.study.done[x.key]); }

}
function elapsed(iso) {
  const ms = Math.max(0, Date.now() - new Date(iso).getTime());
  const h = Math.floor(ms / 36e5), m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
  return { ms, text: `${h}:${pad(m)}:${pad(s)}`, hours: ms / 36e5 };

    </section>`;
  }
  return `
  <div class="head"><span class="eyebrow">Fasting &amp; prayer</span><h2>"When you <em>fast</em>…"</h2>
  <p class="lede">Hunger turned into prayer. Plan a fast, keep your heart on Jesus while you fast, and remember what He showed you.</p></div>
  ${live}
  <div class="grid3">${FAST_PRAYERS.map(p => `<div class="sticky ${p.color}" style="font-size:1.25rem">${esc(p.text)}<small>${esc(p.when)}</small></div>`).join('')}</div>
  <div class="grid2">
    <section class="card stack">
      <h3>When I will fast</h3>
      <div class="grid2"><label class="field">Date<input type="date" class="text" id="plan-date" value="${addDays(t, 1)}" min="${t}"></label>
      <label class="field">Kind of fast<select id="plan-type">${FAST_TYPES.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label></div>
      <label class="field">Purpose<input class="text" id="plan-purpose" placeholder="What I'll seek God for"></label>
      <div><button class="btn small" data-act="planfast">${ICON.plus} Add to my plan</button></div>
      <div class="log">${planned.length ? planned.map(p => `<div class="log-item rose"><div class="row" style="justify-content:space-between"><b>${esc(fmt(p.date, { weekday: 'long', day: 'numeric', month: 'short' }))}</b>
        <span class="row" style="gap:4px">${p.date === t && !fa ? `<button class="btn small primary" data-act="startplanned" data-id="${p.id}">Start now</button>` : ''}<button class="x" data-act="delplan" data-id="${p.id}" aria-label="Remove">${ICON.x}</button></span></div>
        <span class="small muted">${esc(fastTypeOf(p.type).name)}${p.purpose ? ' · ' + esc(p.purpose) : ''}</span></div>`).join('') : '<p class="empty">No fasts planned yet. Many people fast on a set day each week or before a big decision.</p>'}</div>
    </section>
    <section class="card stack">
      <h3>My fasts</h3>
      <div class="log">${hist.length ? hist.map(h => `<div class="log-item"><div class="row" style="justify-content:space-between"><b>${esc(fastTypeOf(h.type).name)} · ${esc(durText(h.actualHours))}</b><button class="x" data-act="delhist" data-id="${h.id}" aria-label="Delete">${ICON.x}</button></div>
        <span class="small muted">${esc(fmtTime(h.start))}${h.purpose ? ' · ' + esc(h.purpose) : ''}</span>${h.notes ? `<p class="note-text">${esc(h.notes)}</p>` : ''}</div>`).join('') : '<p class="empty">Your finished fasts and what God showed you will be kept here.</p>'}</div>
    </section>
  </div>
  <section class="card">
    <h3 style="margin-bottom:6px">Learn about fasting</h3>
    <details class="teach" open><summary>What is biblical fasting?</summary><div class="body">
      <p>Fasting is choosing to go without food (or something else you lean on) for a set time so you can give that hunger and time to God. Jesus expected His followers to fast: He said <i>"when ye fast"</i>, not "if" (Matthew 6:16).</p>
      <p>It isn't a diet, a punishment or a way to earn God's favour. It is a way of saying with your whole body: <i>"Lord, I need You more than I need bread"</i> (Matthew 4:4).</p></div></details>
    <details class="teach"><summary>Why people fasted in the Bible</summary><div class="body">
      <ul class="hearts stack" style="gap:6px"><li><b>To return to God</b> with the whole heart (Joel 2:12)</li><li><b>To ask for protection and help</b>, like Ezra before the journey (Ezra 8:21-23) and Esther before going to the king (Esther 4:16)</li><li><b>To seek direction</b>, as the church did before sending Paul and Barnabas (Acts 13:2-3)</li><li><b>To grieve and repent</b>, like Nehemiah (Nehemiah 1:4)</li><li><b>To set others free</b>: the fast God chooses loosens chains and feeds the hungry (Isaiah 58:6-7)</li><li><b>To prepare for what God calls you to</b>, as Jesus did in the wilderness (Matthew 4:1-2)</li></ul></div></details>
    <details class="teach"><summary>How to fast in a way that honours God</summary><div class="body">
      <ol class="steps"><li><span><b>Start with your why.</b> Write your purpose down before you begin.</span></li><li><span><b>Replace, don't just remove.</b> Use mealtimes for prayer and Scripture.</span></li><li><span><b>Keep it between you and God.</b> Look after yourself and don't announce it (Matthew 6:17-18).</span></li><li><span><b>Watch your heart.</b> Fasting with a harsh spirit misses the point (Isaiah 58:3-5).</span></li><li><span><b>Write down what He shows you.</b> Use the fasting journal above.</span></li><li><span><b>Break it gently</b> with thanks and light food: fruit, broth, small portions.</span></li></ol></div></details>
    <details class="teach"><summary>Please look after your body</summary><div class="body">
      <p>Your body is a gift from God. If you are pregnant or breastfeeding, have diabetes or another medical condition, take medication, or have struggled with eating, please talk to your doctor before fasting from food. A <b>media fast</b> or giving up one specific thing honours God just as much.</p>
      <p>Drink plenty of water during food fasts. If you feel faint, unwell or confused, stop and eat. Ending a fast early for your health is wisdom, not failure.</p></div></details>
  </section>`;
}

function viewStudy() {

            ${STUDY_FIELDS.map(([f, l]) => `<label class="field">${l}<textarea data-bind="study.notes.${k}.${f}" rows="2">${esc(n[f] || '')}</textarea></label>`).join('')}</div>` : ''}
        </div>`; }).join('')}</div>
      <div class="week-q"><span class="eyebrow">This week's question</span><p>${esc(w.q)}</p>

function verseGrid(list) {
  const q = view.q.trim().toLowerCase();
  const found = q ? list.filter(v => (v.ref + ' ' + v.text).toLowerCase().includes(q)) : list;
  return found.length ? `<p class="small muted">${found.length} verse${found.length === 1 ? '' : 's'}</p><div class="verses">${found.map(v => verseCard(v)).join('')}</div>`
    : `<p class="empty">No verses match "${esc(view.q)}". Try another word, or add it in My verses.</p>`;
}

      <div class="chips" role="group" aria-label="Topics">${['All', ...TOPICS].map(tp => `<button class="chip" data-act="topic" data-id="${esc(tp)}" aria-pressed="${view.topic === tp}">${esc(tp)}</button>`).join('')}</div>

      <label class="field">The lie I've been believing<input class="text" id="tr-lie" placeholder="e.g. I'm too far behind to ever change"></label>
      <label class="field">What God says is true<textarea id="tr-truth" rows="2" placeholder="e.g. His mercies are new every morning"></textarea></label>

      ${S.truths.length ? `<div class="verses">${[...S.truths].reverse().map(x => `<article class="card truth"><div class="row" style="justify-content:space-between"><span class="eyebrow">I used to believe</span><button class="x" data-act="deltruth" data-id="${x.id}" aria-label="Remove">${ICON.x}</button></div>

  </div>
  <section class="card stack">
    <div><span class="eyebrow">Keep this page through your whole walk</span><h3>My God moments</h3></div>
    <div class="chips" role="group" aria-label="Kind of moment">${MOMENT_TYPES.map(([id, l]) => `<button class="chip" data-act="momenttype" data-id="${id}" aria-pressed="${view.momentType === id}">${esc(l)}</button>`).join('')}</div>
    <label class="field" for="gm-text">${esc(mt[1])}<textarea id="gm-text" class="lined" placeholder="Write it down…"></textarea></label>
    <div><button class="btn small primary" data-act="addmoment">${ICON.plus} Keep this moment</button></div>
    ${S.moments.length ? `<div class="notes-wall">${[...S.moments].reverse().map(m => { const t = MOMENT_TYPES.find(x => x[0] === m.type) || MOMENT_TYPES[0];
      return `<div class="sticky ${{ 'bg-sage': 'sage', 'bg-sky': 'sky', 'bg-butter': 'butter', 'bg-rose': '', 'bg-lav': 'lav', 'bg-peach': 'peach' }[t[2]]}" style="font-size:1.3rem">
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="eyebrow">${esc(t[1])}</span><button class="x" data-act="delmoment" data-id="${m.id}" aria-label="Remove">${ICON.x}</button></div>
      <p style="margin-top:6px;white-space:pre-wrap">${esc(m.text)}</p><small>${esc(fmt(m.date, { day: 'numeric', month: 'short', year: 'numeric' }))}</small></div>`; }).join('')}</div>` : ''}
  </section>`;
}

function viewSettings() {
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1), android = /Android/.test(ua);
  let size = 0; try { size = (localStorage.getItem(KEY) || '').length; } catch (e) {}
  return `
  <div class="head"><span class="eyebrow">Settings &amp; backup</span><h2>Make it <em>yours</em></h2></div>
  <div class="grid2">
    <section class="card stack"><h3>About you</h3>
      <label class="field">What should Abide call you?<input class="text" id="set-name" data-bind="name" data-rerender-side="1" value="${esc(S.name)}" placeholder="Your first name"></label>
      <p class="small muted">Scripture in Abide is the King James Version (public domain). Study readings link to Bible Gateway, where you can switch to any translation you like.</p></section>
    <section class="card stack"><h3>Your data</h3>
      <p class="small">Everything is saved automatically on this device, in this browser (${(size / 1024).toFixed(1)} KB so far). Nothing is uploaded anywhere. To move to a new phone or keep a safe copy, download a backup.</p>
      <div class="row"><button class="btn" data-act="export">Download backup</button><button class="btn" data-act="import">Restore backup</button></div>
      ${view.confirmReset ? `<div class="confirm"><b>Erase everything in Abide on this device?</b><span class="small">This deletes your progress sheet, fasts, notes and prayers. Download a backup first if you might want them.</span>
        <div class="row"><button class="btn rose" data-act="reset">Yes, erase it all</button><button class="btn ghost" data-act="askreset">Keep my data</button></div></div>` : '<div><button class="btn ghost small" data-act="askreset">Erase all data…</button></div>'}</section>
  </div>
  <section class="card stack"><h3>Put Abide on your home screen</h3>
    <p class="small">Abide works like an app once it is opened from its web address: its own icon, its own window, and it keeps working without internet.</p>
    <ul class="hearts stack" style="gap:6px">
      <li ${ios ? 'style="font-weight:700"' : ''}><b>iPhone or iPad (Safari):</b> tap Share, then <b>Add to Home Screen</b>.</li>
      <li ${android ? 'style="font-weight:700"' : ''}><b>Android (Chrome):</b> open the ⋮ menu, then <b>Install app</b> or <b>Add to Home screen</b>.</li>
      <li><b>Computer (Chrome or Edge):</b> click the install icon at the right end of the address bar.</li></ul></section>`;
}

/* ================= practise modal ================= */
function practiseModal() {
  const v = verseOf(view.practise); if (!v) return '';
  const lv = view.level, words = v.text.split(/\s+/);
  const levels = ['Read it through', 'Some words hidden', 'Half hidden', 'First letters only', 'All hidden'];
  const html = words.map((w, i) => {
    let cls = '';
    if (lv === 1 && i % 4 === 2) cls = 'hid'; else if (lv === 2 && i % 2 === 1) cls = 'hid'; else if (lv === 3) cls = 'first'; else if (lv === 4) cls = 'hid';
    return `<span class="w ${cls}" ${cls ? 'data-act="reveal" tabindex="0" role="button" aria-label="Hidden word, tap to show"' : ''}>${esc(w)}</span>`;
  }).join(' ');
  const mem = S.verses.memorized.includes(v.ref);
  return `<div class="modal" data-act="closemodal-bg"><div class="card" role="dialog" aria-modal="true" aria-label="Memorise ${esc(v.ref)}">
    <div class="row" style="justify-content:space-between"><div><span class="eyebrow">Memorise · step ${lv + 1} of 5</span><h3>${esc(v.ref)}</h3></div><button class="icon-btn" data-act="closemodal" aria-label="Close">${ICON.x}</button></div>
    <p class="small muted">${levels[lv]}. Say it out loud, then tap a blank to check yourself.</p>
    <p class="practice">${html}</p>
    <div class="row" style="justify-content:space-between">
      <div class="row"><button class="btn small ghost" data-act="level" data-n="-1" ${lv === 0 ? 'disabled' : ''}>Show more</button><button class="btn small" data-act="level" data-n="1" ${lv === 4 ? 'disabled' : ''}>Hide more</button></div>
      <button class="btn small ${mem ? '' : 'primary'}" data-act="memorized" data-ref="${esc(v.ref)}">${mem ? ICON.check + ' Memorised' : 'I know it by heart'}</button>
    </div></div></div>`;
}

/* ================= render ================= */
const VIEWS = { home: viewHome, proverbs31: viewP31, fasting: viewFasting, study: viewStudy, scripture: viewScripture, learn: viewLearn, prayer: viewPrayer, settings: viewSettings };
function renderSide() {
  const t = todayKey(), rh = S.rhythm[t] || {}, fa = S.fast.active;
  document.getElementById('side').innerHTML = `
    <div class="brand">${BRAND}<div><h1>Abide</h1><small>Grow deep, not fast</small></div></div>
    <div class="mini"><div class="mini-date">${esc(fmt(t, { weekday: 'long', day: 'numeric', month: 'long' }))}</div>
      <div class="mini-dots" title="Today's rhythm">${RHYTHM.map(s => `<i class="${rh[s.id] ? 'on' : ''}"></i>`).join('')}<span style="margin-left:6px">${RHYTHM.filter(s => rh[s.id]).length}/4 today · ${rhythmStreak()} day streak</span></div>
      <div>Proverbs 31: ${p31DayTotal(t)} of ${HABITS_TOTAL} today</div>
      ${fa ? `<div class="mini-fast">Fasting: <b data-fast-clock>${elapsed(fa.start).text}</b></div>` : ''}</div>
    <nav class="nav">${TABS.map(x => `<button data-act="go" data-tab="${x.id}" ${view.tab === x.id ? 'aria-current="page"' : ''}>${ICON[x.icon]}${esc(x.label)}</button>`).join('')}</nav>
    <p class="side-foot">"I am the vine, ye are the branches."<br><span style="font-size:.95rem">John 15:5</span></p>`;
  document.getElementById('dock').innerHTML = ['home', 'proverbs31', 'fasting', 'study', 'scripture'].map(id => { const x = TABS.find(t => t.id === id);
    return `<button class="${x.bg}" data-act="go" data-tab="${id}" aria-label="${esc(x.label)}" ${view.tab === id ? 'aria-current="page"' : ''}>${ICON[x.icon]}</button>`; }).join('');
}
function render() {
  const y = window.scrollY;
  renderSide();
  const tab = TABS.find(x => x.id === view.tab);
  document.getElementById('top-title').textContent = tab.label;
  document.getElementById('main').innerHTML = `${ART.corner.replace('<svg', '<svg class="deco tr"')}${ART.sprig.replace('<svg', '<svg class="deco bl"')}<div class="page">${VIEWS[view.tab]()}</div>`;
  document.getElementById('modal-root').innerHTML = view.practise ? practiseModal() : '';
  window.scrollTo(0, y);
}
function go(tab) {
  view.tab = tab; view.lesson = tab === 'learn' ? view.lesson : null; view.endingFast = false; view.confirmReset = false;
  document.getElementById('app').classList.remove('drawer');
  if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab);
  render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { readHash(); render(); });

/* ================= actions ================= */
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, n = Number(b.dataset.n);
  if (a === 'closemodal-bg' && e.target !== b) return;
  switch (a) {
    case 'go': go(b.dataset.tab); return;
    case 'drawer': document.getElementById('app').classList.toggle('drawer'); return;
    case 'rhythm': { const t = todayKey(); S.rhythm[t] = S.rhythm[t] || {}; S.rhythm[t][id] = !S.rhythm[t][id]; save(); break; }
    case 'p31tab': view.p31tab = id; break;
    case 'p31day': { const d = addDays(view.p31day, n); if (d <= todayKey()) view.p31day = d; break; }
    case 'p31week': view.p31week = addDays(view.p31week, 7 * n); break;
    case 'p31month': view.p31month = addMonths(view.p31month, n); break;
    case 'rate': { const m = view.p31month; S.p31Ratings[m] = S.p31Ratings[m] || {}; S.p31Ratings[m][id] = S.p31Ratings[m][id] === n ? 0 : n; save(); break; }
    case 'fav': { const r = b.dataset.ref, f = S.verses.fav; const i = f.indexOf(r); i >= 0 ? f.splice(i, 1) : f.push(r); save(true); toast(i >= 0 ? 'Removed from saved' : 'Verse saved'); break; }
    case 'practise': view.practise = b.dataset.ref; view.level = 0; break;
    case 'closemodal': case 'closemodal-bg': view.practise = null; break;
    case 'level': view.level = Math.max(0, Math.min(4, view.level + n)); break;
    case 'reveal': b.classList.toggle('shown'); return;
    case 'memorized': { const r = b.dataset.ref, m = S.verses.memorized; const i = m.indexOf(r); i >= 0 ? m.splice(i, 1) : m.push(r); if (i < 0 && !S.verses.fav.includes(r)) S.verses.fav.push(r); save(true); toast(i >= 0 ? 'Unmarked' : 'Hidden in your heart'); break; }
    case 'scripttab': view.scriptTab = id; break;
    case 'topic': view.topic = id; break;
    case 'addmine': { const ref = val('mv-ref'), text = val('mv-text'); if (!ref || !text) { toast('Add a reference and the verse'); return; } S.verses.mine.push({ id: uid(), ref, text, note: val('mv-note') }); save(); break; }
    case 'delmine': S.verses.mine = S.verses.mine.filter(v => v.id !== id); save(); break;
    case 'addtruth': { const lie = val('tr-lie'), truth = val('tr-truth'); if (!lie || !truth) { toast('Write the lie and the truth'); return; } S.truths.push({ id: uid(), lie, truth, ref: val('tr-ref'), date: todayKey() }); save(); break; }
    case 'deltruth': S.truths = S.truths.filter(x => x.id !== id); save(); break;
    case 'openday': view.openDay = view.openDay === b.dataset.k ? null : b.dataset.k; break;
    case 'lesson': view.lesson = id || null; if (view.tab !== 'learn') { go('learn'); return; } window.scrollTo(0, 0); break;
    case 'lessondone': S.lessons.done[id] = !S.lessons.done[id]; save(); toast(S.lessons.done[id] ? 'Lesson complete' : 'Marked not done'); break;
    case 'fasttype': { view.fastType = id; view.fastHours = fastTypeOf(id).hours; break; }
    case 'startfast': {
      const hours = Number(val('fast-hours')) || 24;
      S.fast.active = { id: uid(), type: view.fastType, hours, start: new Date().toISOString(), purpose: val('fast-purpose'), focus: val('fast-focus'), verse: val('fast-verse') };
      save(); toast('Your fast has begun. He is with you.'); break;
    }
    case 'startplanned': {
      const p = S.fast.planned.find(x => x.id === id); if (!p) break;
      S.fast.active = { id: uid(), type: p.type, hours: fastTypeOf(p.type).hours, start: new Date().toISOString(), purpose: p.purpose, focus: '', verse: 'Matthew 4:4' };
      S.fast.planned = S.fast.planned.filter(x => x.id !== id); save(); break;
    }
    case 'nextprompt': view.promptI++; break;
    case 'fastjournal': { const text = val('fast-entry'); if (!text || !S.fast.active) { toast('Write something first'); return; } S.fast.journal.push({ id: uid(), fastId: S.fast.active.id, at: new Date().toISOString(), text }); save(); break; }
    case 'askend': view.endingFast = true; break;
    case 'cancelend': view.endingFast = false; break;
    case 'endfast': {
      const fa = S.fast.active; if (!fa) break;
      const j = S.fast.journal.filter(x => x.fastId === fa.id).map(x => x.text);
      S.fast.history.push({ ...fa, end: new Date().toISOString(), actualHours: elapsed(fa.start).hours, notes: [val('end-notes'), ...j].filter(Boolean).join('\n\n') });
      S.fast.active = null; view.endingFast = false; save(); toast('Fast complete. Well done, faithful one.'); break;
    }
    case 'planfast': { const date = val('plan-date'); if (!date) { toast('Pick a date'); return; } S.fast.planned.push({ id: uid(), date, type: val('plan-type'), purpose: val('plan-purpose') }); save(); break; }
    case 'delplan': S.fast.planned = S.fast.planned.filter(x => x.id !== id); save(); break;
    case 'delhist': S.fast.history = S.fast.history.filter(x => x.id !== id); save(); break;
    case 'addprayer': { const text = val('pr-text'); if (!text) { toast('Write your request first'); return; } S.prayers.push({ id: uid(), text, date: todayKey(), answered: false }); save(); break; }
    case 'answering': view.answering = id || null; break;
    case 'answer': { const p = S.prayers.find(x => x.id === id); if (p) { p.answered = true; p.answeredOn = todayKey(); p.answer = val('ans-text'); } view.answering = null; save(true); toast('Praise God!'); break; }
    case 'delprayer': S.prayers = S.prayers.filter(x => x.id !== id); save(); break;
    case 'momenttype': view.momentType = id; break;
    case 'addmoment': { const text = val('gm-text'); if (!text) { toast('Write it down first'); return; } S.moments.push({ id: uid(), type: view.momentType, text, date: todayKey() }); save(); break; }
    case 'delmoment': S.moments = S.moments.filter(x => x.id !== id); save(); break;
    case 'export': exportBackup(); return;
    case 'import': document.getElementById('restore-file').click(); return;
    case 'askreset': view.confirmReset = !view.confirmReset; break;
    case 'reset': S = defaults(); view.confirmReset = false; try { localStorage.removeItem(KEY); } catch (err) {} toast('Abide has been reset'); break;
    default: return;
  }
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && view.practise) { view.practise = null; render(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.w[data-act="reveal"]')) { e.preventDefault(); e.target.classList.toggle('shown'); }
  if (e.key === 'Enter' && e.target.id === 'pr-text') { e.preventDefault(); document.querySelector('[data-act="addprayer"]').click(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.check) { setPath(t.dataset.check, t.checked); save(true); render(); return; }
  if (t.dataset.bind && t.dataset.rerender) { setPath(t.dataset.bind, t.value); save(); render(); return; }
  if (t.id === 'fast-hours') view.fastHours = Number(t.value);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'verse-search') {
    view.q = t.value;
    const list = view.topic === 'All' ? VERSES : VERSES.filter(v => v.topic === view.topic);
    document.getElementById('verse-grid').innerHTML = verseGrid(list);
    return;
  }
  if (t.dataset.bind && !t.dataset.rerender) { setPath(t.dataset.bind, t.value); save(true); if (t.dataset.rerenderSide) renderSide(); }
});

/* ================= backup ================= */
function exportBackup() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `abide-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Backup downloaded');
}
document.getElementById('restore-file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || typeof data !== 'object' || !data.p31 || !data.fast) throw new Error('not an Abide backup');
      const base = defaults(); for (const k in base) if (data[k] === undefined) data[k] = base[k];
      S = data; save(true); render(); toast('Backup restored');
    } catch (err) { toast('That file is not an Abide backup'); }
    e.target.value = '';
  };
  r.readAsText(f);
});

/* live fasting clock */
setInterval(() => {
  const fa = S.fast.active; if (!fa) return;
  const e = elapsed(fa.start);
  document.querySelectorAll('[data-fast-clock]').forEach(el => { el.textContent = e.text; });
  const bar = document.querySelector('[data-fast-bar]'); if (bar) bar.style.width = Math.min(100, e.hours / fa.hours * 100) + '%';
}, 1000);
/* keep "today" correct past midnight */
let lastToday = todayKey();
setInterval(() => { const t = todayKey(); if (t !== lastToday) { if (view.p31day === lastToday) view.p31day = t; lastToday = t; if (!document.activeElement || !document.activeElement.matches('input,textarea,select')) render(); } }, 60000);

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
