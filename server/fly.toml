# Fly.io app config for the Burrow & Brief backend.
# Deploy from inside this `server/` directory:
#   fly launch --no-deploy   (first time only — creates/renames the app)
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...
#   fly deploy
#
# Rename `app` below to something globally unique on Fly before deploying.

app = "burrow-and-brief-api"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
