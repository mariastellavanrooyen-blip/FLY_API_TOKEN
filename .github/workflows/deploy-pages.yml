name: Deploy frontend to GitHub Pages

on:
  # Manual only — Maria chose to run the app locally instead of via GitHub
  # Pages (that path needs Pages enabled and/or the repo made public).
  # Trigger this from the Actions tab ("Run workflow") if that changes.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Add Penny Plan (budget app) at /budget/
        run: node budget/build.mjs frontend/dist/budget

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
